  }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  .ink2 { fill: var(--ink2); } .muted { fill: var(--muted); }
  .card { fill: var(--card); stroke: var(--edge); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .good { fill: var(--good); } .bad { fill: var(--bad); } .warn { fill: var(--warn); } .neu { fill: var(--neu); } .acc { fill: var(--acc); } .vio { fill: var(--vio); }
  .good-bg { fill: var(--good-bg); stroke: var(--good); } .bad-bg { fill: var(--bad-bg); stroke: var(--bad); }
  .warn-bg { fill: var(--warn-bg); stroke: var(--warn); } .neu-bg { fill: var(--neu-bg); stroke: var(--neu); }
  .acc-bg { fill: var(--acc-bg); stroke: var(--acc); } .vio-bg { fill: var(--vio-bg); stroke: var(--vio); }
  .s-good { stroke: var(--good); } .s-bad { stroke: var(--bad); } .s-acc { stroke: var(--acc); } .s-ink2 { stroke: var(--ink2); } .s-muted { stroke: var(--muted); }
</style>

